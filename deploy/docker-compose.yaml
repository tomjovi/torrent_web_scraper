# 배포 위치: /volume1/docker/torrent_web_scraper/docker-compose.yaml
# 소스 위치: /volume1/dev/torrent_web_scraper (SOURCE_DIR)
#
# 주의: 기존 /volume1/docker/torrentscraper manager 와 동시에 스크랩하면
#       토렌트가 중복 추가될 수 있습니다. 한쪽 스케줄/사이트를 비활성화하세요.

services:
  scraper:
    build:
      context: ${SOURCE_DIR}
      dockerfile: docker/Dockerfile
    image: torrent-web-scraper:latest
    container_name: torrent-web-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LC_ALL: ${LC_ALL:-C.UTF-8}
    volumes:
      - ${SOURCE_DIR}/src:/scraper
      - torrent_config:/scraper/config
      - ${VIDEO}:${VIDEO}
      - ${DOWNLOADS}:${DOWNLOADS}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  torrent_config:
    external: true
    name: ${CONFIG_VOLUME}
